		function openHTMLFile(fileName) {
			try {
				window.open(fileName, "_blank");
			} catch (error) {
				alert("Failed to open the HTML file: " + error.message);
			}
		}
		function createImageTable(data) {
			const table = document.getElementById('imageTable');
			let row;

			for (let i = 0; i < data.length; i++) {
				if (i % 4 === 0) {
					row = table.insertRow();
				}

				const cell = row.insertCell();
				cell.style.textAlign = 'center';

				const img = document.createElement('img');
				img.src = data[i].ImageFileName;
				img.alt = data[i].Title;
				img.addEventListener("click", () => openHTMLFile(data[i].HTMLFileName));


				const title = document.createElement('div'); // span을 div로 변경

				title.innerHTML = data[i].Title;
				title.style.marginTop = '2px'; // 이미지와 글자 사이 간격 약간 주기

				cell.appendChild(img);
				cell.appendChild(title);
			}
		}

		createImageTable(data);
