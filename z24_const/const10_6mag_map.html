	<div id="constellation-container" class="div_bg_max900"></div>

	<script>

//		const c_ConstName_HSort = [		sf2020_common.js에 정의
//		const c_ConstName_ESort = [

		const container = document.getElementById('constellation-container');

		for (let i = 0; i < c_ConstName_HSort.length; i += 4) {
			const row = document.createElement('tr');

			for (let j = 0; j < 4; j++) {
				if (i + j < c_ConstName_HSort.length) {
					const name = c_ConstName_HSort[i + j];
					const title = c_ConstName_HSort[i + j] +'<br>' + c_ConstEName_HSort[i+j];
					const cell = document.createElement('td');

					// 가운데 맞춤 스타일 추가
					cell.style.textAlign     = 'center'; // 텍스트 가운데 정렬
					cell.style.verticalAlign = 'middle'; // 수직 가운데 정렬

					let image_path = '../z90_images/i24_constellation/별바라기_성도_' + name + '자리.jpg';
					let small_image_path = '../z90_images/i24_constellation/small/별바라기_성도_' + name + '자리_small.JPG';
					// 파일 존재 여부 체크
//					if(c_ConstImage[i + j] == 0)
//						image_path = '../z90_images/i24_constellation/00.green_blank.png';

					// 이미지 경로가 결정된 후에 셀의 innerHTML을 설정
					cell.innerHTML = `
						<img src="${small_image_path}"
						class="pic1"
						onclick="simpleLightbox('${image_path}', 5000);">
						<br>${title}
					`;
					row.appendChild(cell);
				} else {
					const cell = document.createElement('td');
					cell.style.textAlign = 'center'; // 빈 셀도 가운데 정렬
					cell.style.verticalAlign = 'middle'; // 빈 셀도 수직 가운데 정렬
					row.appendChild(cell); // 빈 셀 추가
				}
			}
			container.appendChild(row);
		}
	</script>
