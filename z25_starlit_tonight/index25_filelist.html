<div class="div_bg_max700">

	<h2 align="left">오늘밤 별하늘 전체 목록</h2>

	<!-- 링크들이 생성되어 들어갈 컨테이너 -->
	<div id="list-container"></div>

	<script>
		// 1. 직접 작성하실 연월 배열 (YYYY-MM 형식)
		// ※ 정렬되어 있지 않아도 코드가 알아서 연도별/월별로 정렬합니다.
		const dateArray = ["2026-05", "2026-06", "2026-10",];

		// 2. 파일명 규칙을 만들어주는 함수 (정규식/포맷에 맞게 수정하세요)
		// 예: "2026-01" -> "report_2026_01.pdf" 형태로 변환한다고 가정
		function createFileName(dateStr) {
			return `starlit_${dateStr}.html`;
		}

		// --- 여기서부터는 자동으로 처리되는 로직입니다 ---

		// 배열을 오름차순(과거 -> 최신)으로 정렬
		dateArray.sort();

		const container = document.getElementById('list-container');
		let currentYear = "";
		let currentUl = null;

		dateArray.forEach(dateStr => {
			const [year, month] = dateStr.split('-');
			const fileName = createFileName(dateStr);

			// 새로운 연도가 나타나면 h3 태그와 새로운 ul 태그 생성
			if (year !== currentYear) {
				currentYear = year;

				const h3 = document.createElement('h3');
				h3.textContent = `${year}년`;
				container.appendChild(h3);

				currentUl = document.createElement('ul');
				container.appendChild(currentUl);
			}

			// 각 월별 파일 링크(a 태그) 생성
			const li = document.createElement('li');
			const a = document.createElement('a');

			a.href = `./${fileName}`;       // 같은 폴더 안의 파일 상대 경로
			a.textContent = `${month}월의 별하늘`;
			a.target = "_blank";            // 새 탭에서 열기

			li.appendChild(a);
			currentUl.appendChild(li);
		});
	</script>
<hr>
